<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyLandlord &amp; MyTenant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#16213a;--mut:#5d667a;--line:#e4e2dc;--a:#16213a;--b:#c9973f;--soft:#eef1f7;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root.t{--a:#0e7c66;--b:#ff6f59;--soft:#e8f6f2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1320;--card:#181d2e;--ink:#eef0f6;--mut:#9aa3b8;--line:#2a3148;--soft:#222a42;--a:#c9973f}
:root.t{--soft:#14302b;--a:#2bb89a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h2{font:600 20px Sora,sans-serif;margin:8px 0 12px}
.logo{font:700 24px Sora,sans-serif;color:var(--a)}.logo b{color:var(--b)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.p{margin-top:14px;width:100%;border:0;border-radius:14px;padding:13px;background:var(--a);color:#fff;font-weight:700}
.p:disabled{opacity:.6}
.s{background:none;border:0;color:var(--mut);text-decoration:underline;padding:6px 0}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:3px;margin-bottom:6px}
.tabs button{flex:1;border:0;background:none;color:var(--ink);padding:9px;border-radius:999px}
.tabs button.on{background:var(--a);color:#fff}
.mut{color:var(--mut);font-size:14px}
.msg{padding:10px 12px;border-radius:12px;background:var(--soft);margin:10px 0;font-size:14px}
.err{border:1px solid #c0392b}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--a)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
</style></head><body><main>
<div class="top"><div class="logo" id="logo">My<b>Landlord</b></div><button class="s" id="out" hidden>Log out</button></div>
<div id="msg"></div><div id="view"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://jqjtsavjookafeeprepl.supabase.co","sb_publishable_8dhYidkyUHV9NqoZXv9z1Q_rgLScApJ");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mode="login",user=null,profile=null,recovery=false;
function msg(t,bad){$("msg").innerHTML=t?'<div class="msg'+(bad?' err':'')+'" role="status">'+esc(t)+'</div>':""}
function authView(){
 const r=mode=="register";
 $("view").innerHTML='<div class="tabs"><button data-m="login" class="'+(r?"":"on")+'">Log in</button><button data-m="register" class="'+(r?"on":"")+'">Register</button></div><div class="card">'+
 (r?'<label for="fn">Full name</label><input id="fn" autocomplete="name"><label for="role">I am a</label><select id="role"><option value="landlord">Landlord</option><option value="tenant">Tenant</option></select>':'')+
 '<label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" autocomplete="'+(r?"new":"current")+'-password" minlength="8">'+
 '<button class="p" id="go">'+(r?"Create account":"Log in")+'</button>'+(r?'':'<button class="s" id="forgot">Forgot password?</button>')+'</div>'}
function recoveryView(){$("view").innerHTML='<h2>Choose a new password</h2><div class="card"><label for="np">New password (8+ characters)</label><input id="np" type="password" minlength="8"><button class="p" id="setpw">Save password</button></div>'}
async function appView(){
 const {data:p,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
 if(error){msg("Could not load your profile: "+error.message,true);return}
 profile=p;document.documentElement.classList.toggle("t",p.role=="tenant");
 $("logo").innerHTML=p.role=="tenant"?"My<b>Tenant</b>":"My<b>Landlord</b>";$("out").hidden=false;
 p.role=="landlord"?landlordView():tenantView()}
async function landlordView(){
 const [{data:props,error:e1},{data:inv}]=await Promise.all([
  sb.from("properties").select("id,address,monthly_rent_pence,tenancies(profiles(full_name,email))").order("created_at"),
  sb.from("invitations").select("property_id,email").is("claimed_at",null)]);
 if(e1){msg(e1.message,true);return}
 $("view").innerHTML='<h2>Hello, '+esc(profile.full_name||profile.email)+'</h2><h2>Properties</h2><div class="card"><label for="ad">Address</label><input id="ad" placeholder="12 Example Road, Leeds"><label for="rt">Monthly rent (£)</label><input id="rt" type="number" min="0" step="0.01"><button class="p" id="addp">Add property</button></div>'+
 (props.length?props.map(p=>{const ts=(p.tenancies||[]).map(t=>t.profiles).filter(Boolean),pi=(inv||[]).filter(i=>i.property_id==p.id);
  return '<div class="card"><b>'+esc(p.address)+'</b><div class="mut">£'+((p.monthly_rent_pence||0)/100).toFixed(2)+' a month · '+ts.length+' tenant'+(ts.length==1?"":"s")+'</div>'+
  ts.map(t=>'<div>'+esc(t.full_name||"")+' <span class="mut">'+esc(t.email)+'</span></div>').join("")+
  pi.map(i=>'<div><span class="pill">Invited</span> '+esc(i.email)+'</div>').join("")+
  '<label for="iv'+p.id+'">Invite a tenant by email</label><input id="iv'+p.id+'" type="email"><button class="p" data-inv="'+p.id+'">Send invitation</button><button class="s" data-del="'+p.id+'">Remove property</button></div>'}).join(""):'<div class="card mut">No properties yet. Add your first above.</div>')+
 '<p class="mut">An invited tenant is linked to the property when they register with that email address.</p>'}
async function tenantView(){
 const {data:props,error}=await sb.from("properties").select("id,address,monthly_rent_pence");
 if(error){msg(error.message,true);return}
 $("view").innerHTML='<h2>Hello, '+esc(profile.full_name||profile.email)+'</h2><h2>My tenancy</h2>'+(props.length?props.map(p=>'<div class="card"><b>'+esc(p.address)+'</b><div class="mut">Rent: £'+((p.monthly_rent_pence||0)/100).toFixed(2)+' a month</div></div>').join(""):'<div class="card mut">You are not linked to a property yet. Ask your landlord to invite the email address you registered with.</div>')}
document.addEventListener("click",async e=>{const t=e.target;msg("");
 if(t.dataset.m){mode=t.dataset.m;authView();return}
 if(t.id=="go"){const em=$("em").value.trim(),pw=$("pw").value;if(!em||pw.length<8){msg("Enter an email and a password of at least 8 characters.",true);return}
  t.disabled=true;let r;
  if(mode=="register")r=await sb.auth.signUp({email:em,password:pw,options:{data:{role:$("role").value,full_name:$("fn").value.trim()},emailRedirectTo:location.origin+location.pathname}});
  else r=await sb.auth.signInWithPassword({email:em,password:pw});
  t.disabled=false;
  if(r.error){msg(r.error.message,true);return}
  if(mode=="register"&&!r.data.session){msg("Account created. Check your email and tap the confirmation link, then log in.");mode="login";authView()}return}
 if(t.id=="forgot"){const em=$("em").value.trim();if(!em){msg("Enter your email above first.",true);return}
  const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});msg(r.error?r.error.message:"If that email has an account, a reset link is on its way.",!!r.error);return}
 if(t.id=="setpw"){const r=await sb.auth.updateUser({password:$("np").value});if(r.error){msg(r.error.message,true);return}recovery=false;msg("Password updated.");route();return}
 if(t.id=="out"){await sb.auth.signOut();return}
 if(t.id=="addp"){const ad=$("ad").value.trim();if(!ad){msg("Enter an address.",true);return}
  const r=await sb.from("properties").insert({landlord_id:user.id,address:ad,monthly_rent_pence:Math.round(parseFloat($("rt").value||0)*100)});
  if(r.error)msg(r.error.message,true);else landlordView();return}
 if(t.dataset.del){if(!confirm("Remove this property and its tenancies?"))return;const r=await sb.from("properties").delete().eq("id",t.dataset.del);if(r.error)msg(r.error.message,true);else landlordView();return}
 if(t.dataset.inv){const em=$("iv"+t.dataset.inv).value.trim();if(!em){msg("Enter the tenant's email.",true);return}
  const r=await sb.from("invitations").insert({landlord_id:user.id,property_id:t.dataset.inv,email:em});
  if(r.error)msg(r.error.message,true);else{msg("Invitation saved for "+em+".");landlordView()}}});
function route(){if(recovery)recoveryView();else if(user)appView();else{$("out").hidden=true;document.documentElement.classList.remove("t");$("logo").innerHTML="My<b>Landlord</b>";authView()}}
sb.auth.onAuthStateChange((ev,s)=>{user=s?s.user:null;if(ev=="PASSWORD_RECOVERY")recovery=true;setTimeout(route,0)});
sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;route()});
</script></body></html>
